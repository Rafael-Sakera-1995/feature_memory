[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feature-memory"
version = "0.1.0"
description = "Local MCP server that maintains a markdown knowledge base of product features for Cursor agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rafael Sakera" }]
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "boto3>=1.34.0",
    "faiss-cpu>=1.7.4",
    "openai>=1.30.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0.0",
]

[project.scripts]
feature-memory-mcp = "feature_memory.server:main"
feature-memory-migrate = "feature_memory.scripts.migrate_to_s3:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
