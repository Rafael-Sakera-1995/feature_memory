# Kosmos deployment shape for the Feature Memory MCP service.
#
# This is a tiny, stateless HTTP service. Cold start is ~50ms (no warmup,
# no caches). One replica is enough for correctness; two for HA. CPU and
# memory needs are minimal - the heavy lifting is offloaded to S3 Vectors
# and Bedrock.

webservers:
  main:
    replicas:
      numberOfReplicas: 2
      maxSurge: "25%"
      maxUnavailable: "25%"
    resources:
      cpu: "500m"
      memory: 512Mi
    program: feature-memory-mcp
    ports:
      - 8080
    probes:
      readiness:
        path: /ready
        port: 8080
        initialDelaySeconds: 2
        periodSeconds: 5
      liveness:
        path: /healthz
        port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
